plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def cisloSestaveni = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

android {
    namespace 'cz.sperlich.soubory'
    compileSdk 34

    defaultConfig {
        applicationId 'cz.sperlich.soubory'
        minSdk 30
        targetSdk 34
        versionCode cisloSestaveni
        versionName "1.0." + cisloSestaveni
    }

    signingConfigs {
        pevny {
            storeFile file('podpis.jks')
            storePassword 'spravce123'
            keyAlias 'spravce'
            keyPassword 'spravce123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.pevny
        }
        debug {
            signingConfig signingConfigs.pevny
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'io.coil-kt:coil-video:2.7.0'
    implementation 'com.github.mwiede:jsch:0.2.20'
}
